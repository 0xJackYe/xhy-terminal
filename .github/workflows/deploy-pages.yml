# Publishes the portal's front end to Cloudflare Pages on every push.
# Only frontend/ is uploaded: the repository root also holds configs/ with
# exchange credentials, which must never be deployed.
# main is the production site; other branches get preview addresses.
name: Deploy to Cloudflare Pages

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: xhy
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Create the Pages project on first run
        run: npx --yes wrangler@4.149.0 pages project create "$PROJECT" --production-branch=main || echo "Project already exists."

      - name: Deploy frontend/
        run: npx --yes wrangler@4.149.0 pages deploy frontend --project-name="$PROJECT" --branch="$GITHUB_REF_NAME" --commit-dirty=true
