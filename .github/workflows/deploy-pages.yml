# Publishes the portal's front end to Cloudflare Pages on every push.
# Only frontend/ is uploaded: the repository root also holds configs/ with
# exchange credentials, which must never be deployed.
# main is the production site; other branches get preview addresses.
# If the Pages project is connected to this repository in the Cloudflare
# dashboard instead, leave the secrets unset and this workflow does nothing.
name: Deploy to Cloudflare Pages

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: xhy
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::No Cloudflare secrets set; skipping (Cloudflare's own Git integration deploys instead)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the Pages project on first run
        if: steps.secrets.outputs.ready == 'true'
        run: npx --yes wrangler@4.149.0 pages project create "$PROJECT" --production-branch=main || echo "Project already exists."

      - name: Deploy frontend/
        if: steps.secrets.outputs.ready == 'true'
        run: npx --yes wrangler@4.149.0 pages deploy frontend --project-name="$PROJECT" --branch="$GITHUB_REF_NAME" --commit-dirty=true
