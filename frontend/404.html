<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark">
<title>XHY · 页面不存在</title>
<style>
  :root { --bg: #f6f5f2; --text: #191816; --muted: #5f5c55; --accent: #e0561b; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e0e0d; --text: #f2f0eb; --muted: #b0ada5; --accent: #ff7a3d; color-scheme: dark; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  main { padding: 24px 16px; text-align: center; }
  .code { font: 600 15px "SF Mono", "Cascadia Mono", ui-monospace, Consolas, monospace; color: var(--muted); }
  .code span { color: var(--accent); }
  h1 { margin: 10px 0 6px; font-size: 26px; letter-spacing: -.5px; }
  p { margin: 0 0 18px; color: var(--muted); }
  a { color: var(--text); text-underline-offset: 4px; }
</style>
</head>
<body>
<main><p class="code">~/xhy <span>404</span></p><h1>页面不存在</h1><p>这个地址没有内容。</p><a href="/">返回总览</a></main>
</body>
</html>
