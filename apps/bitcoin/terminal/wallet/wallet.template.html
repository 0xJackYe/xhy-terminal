<body>
<main>
  <section class="panel" aria-label="比特币地址余额与历史走势">
    <header class="topbar">
      <div class="identity"><div class="coin" aria-hidden="true">₿</div><h1>比特币余额</h1></div>
      <div class="actions"><button class="button" id="save" aria-label="保存 HTML"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M10 2v11m-4-4 4 4 4-4M3 13v4h14v-4"/></svg><span class="save-label">保存 HTML</span></button><button class="button primary" id="refresh"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M16 8a6 6 0 1 0 0 5M16 3v5h-5"/></svg><span>刷新</span></button></div>
    </header>
    <div class="hero">
      <div><div class="label">地址总市值 <span id="total-currency">/ CNY</span></div><h2 id="total-usd">—</h2><div class="btc-total" id="total-btc">— <span>BTC · 已确认</span></div></div>
      <div class="pnl-box" id="pnl-box"><div class="pnl-heading"><div class="label" id="pnl-label">今日盈亏</div><select class="pnl-select" id="pnl-period" aria-label="盈亏时间范围"><option value="today">今日</option><option value="7">近一周</option><option value="30">近一个月</option><option value="90">近三个月</option></select></div><strong id="daily-pnl" aria-live="polite">—</strong><small id="pnl-note">剔除转账 · 含汇率变动</small><small class="pnl-dates" id="pnl-dates"></small></div>
      <div class="quote-box"><div class="label" id="quote-currency">BTC / CNY</div><strong id="quote-price">—</strong><small id="quote-time">等待行情</small><small class="fx-caption" id="fx-caption"></small></div>
    </div>
    <div class="address-row"><span class="address-label">地址</span><a id="address-link" target="_blank" rel="noopener noreferrer">—</a><button class="copy" id="copy" aria-label="复制比特币地址"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="7" y="7" width="9" height="10" rx="1"/><path d="M12 7V3H3v10h4"/></svg></button></div>
    <div id="notice" class="notice" hidden role="status"></div>
    <section class="goal" aria-labelledby="goal-title">
      <div class="goal-heading"><h2 id="goal-title">攒到 1 BTC</h2><span class="goal-percent" id="goal-percent">—</span></div>
      <div class="goal-track" id="goal-progress" role="progressbar" aria-label="攒到一个比特币的进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="goal-fill" id="goal-fill"></div><i class="goal-tick" style="left:10%" aria-hidden="true"></i><i class="goal-tick" style="left:25%" aria-hidden="true"></i><i class="goal-tick" style="left:50%" aria-hidden="true"></i><i class="goal-tick" style="left:100%" aria-hidden="true"></i></div>
      <div class="goal-detail"><span>已持有 <strong id="goal-held">—</strong></span><span class="goal-remaining" id="goal-remaining">目标 1 BTC</span></div>
      <ol class="milestones" id="goal-milestones" aria-label="按当前已确认余额计算的阶段里程碑"></ol>
      <div class="milestone-next" id="milestone-next" aria-live="polite"><span>下一阶段</span><strong>—</strong></div>

    try{const cached=JSON.parse(storage.getItem(CACHE_KEY));if(cached&&Date.parse(cached.fetchedAt)>Date.parse(data.fetchedAt)){validateSnapshot(cached, ADDRESS);const fx=(Date.parse(cached.fx?.fetchedAt)||0)>(Date.parse(data.fx?.fetchedAt)||0)?cached.fx:data.fx;data={...cached,fx};cacheUsed=true;}}catch{}
    render();setStatus((cacheUsed?'本地缓存':'内置快照')+' · '+time(history.asOf)+' UTC');nextRefreshAt=Math.min(Date.parse(data.fetchedAt)+REFRESH_INTERVAL_MS,Date.now()+REFRESH_INTERVAL_MS);
    // Reuse a fresh snapshot; old snapshots refresh without hiding the last known data.
    if(Date.now()-Date.parse(data.fetchedAt)>5*60*1000) refresh();
  } catch(error) {setStatus('数据无法读取','error');setNotice(error.message);$('empty').hidden=false;$('empty').textContent='点击刷新重试';}
  let displayedDay=Math.floor((Date.now()/1000+28800)/86400);
  function checkUpdates(){if(!pageActive||document.hidden||!data||!ADDRESS)return;const day=Math.floor((Date.now()/1000+28800)/86400),newDay=day!==displayedDay;if(newDay){displayedDay=day;render();}if(!busy&&(newDay||Date.now()>=nextRefreshAt))refresh();}
  setInterval(checkUpdates,30000);
  document.addEventListener('visibilitychange',checkUpdates);
  window.addEventListener('pagehide',()=>{pageActive=false;if(refreshController){resumeRefresh=true;refreshController.abort();}});
  window.addEventListener('pageshow',event=>{pageActive=true;if(event.persisted&&resumeRefresh&&!busy){resumeRefresh=false;refresh();}else checkUpdates();});
  document.addEventListener('keydown',event=>{
    if (event.key==='Escape' && parent!==window && /^https?:$/.test(location.protocol)) {
      parent.postMessage({type:'wallet-escape'},location.origin);
    }
  });
  let sentHeight=0, heightFrame=0;
  function announceHeight() {
    if (parent===window || !/^https?:$/.test(location.protocol) || heightFrame) return;
    heightFrame=requestAnimationFrame(()=>{
      heightFrame=0;
      const height=Math.ceil(document.querySelector('main').getBoundingClientRect().height)+2;
      if (height>0 && height!==sentHeight) {
        sentHeight=height;
        parent.postMessage({type:'wallet-height',height},location.origin);
      }
    });
  }
  new ResizeObserver(announceHeight).observe(document.querySelector('main'));
  window.addEventListener('load',announceHeight);
  announceHeight();
})();
</script>
